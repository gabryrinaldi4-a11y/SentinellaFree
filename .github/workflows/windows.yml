name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build unsigned original components
        run: ./build.ps1 -OutputDirectory "${{ runner.temp }}/Sentinella/unsigned"
      - name: Read-only application-control checks
        run: dotnet run --project tests/AppControlTests/AppControlTests.csproj -c Release -- --native
      - name: Upload unsigned build for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SentinellaFree-unsigned-windows-x64
          path: ${{ runner.temp }}/Sentinella/unsigned/
          retention-days: 14
          if-no-files-found: error
